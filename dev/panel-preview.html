<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRP Lumen - panel preview (UI only)</title>
<style>
  html,body { margin:0; height:100%; background:#05080d; color:#8fa6b8; font:14px/1.5 'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #canvaswrapper { position:fixed; inset:0; }
  #canvaswrapper canvas { width:100%; height:100%; display:block; }
  .note { position:fixed; top:18px; right:18px; max-width:330px; padding:14px 16px; border:1px solid #24384a;
    border-radius:12px; background:#0b131cdd; color:#9fb6c6; font-size:12.5px; z-index:5; }
  .note b { color:#e7c98d; letter-spacing:.14em; display:block; margin-bottom:6px; font-size:11px; }
  kbd { background:#1d2c3c; border:1px solid #33485c; border-radius:4px; padding:1px 6px; font:12px Consolas,monospace; color:#dbe8f2; }
</style>
</head>
<body>
<!-- Local UI harness only. This is NOT Starblast and loads nothing from the game.
     It exists so the MRP panel/dock can be reviewed without installing the userscript. -->
<div id="canvaswrapper"><canvas id="starfield"></canvas></div>
<div class="note">
  <b>MRP LUMEN / UI HARNESS</b>
  Local preview of the panel only. There is no Three.js renderer here, so the adapter stays in
  "waiting" state and the ship/laser effects cannot be shown - the inline swatches still update live.<br><br>
  <kbd>Shift</kbd>+<kbd>M</kbd> panel &nbsp; <kbd>Alt</kbd>+<kbd>M</kbd> effects on/off
</div>
<script>
  // Tiny starfield so the panel can be judged against a dark game-like backdrop.
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    stars = Array.from({ length: 260 }, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + .2, s: Math.random() * .25 + .04,
    }));
  }
  function frame() {
    ctx.fillStyle = '#05080d'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const star of stars) {
      star.y += star.s; if (star.y > canvas.height) star.y = 0;
      ctx.globalAlpha = .35 + star.r / 3;
      ctx.fillStyle = '#9fd9ff';
      ctx.fillRect(star.x, star.y, star.r, star.r);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize); resize(); frame();
</script>
<script src="../Starblast-MRP.user.js"></script>
</body>
</html>
